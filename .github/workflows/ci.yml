name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - name: Boot smoke-test
        env:
          ADGEN_ROLE: api
          MONGODB_URI: mongodb://localhost:27017/adgen_ci
          PORT: '4000'
        run: |
          set -euo pipefail
          LOG_FILE="${RUNNER_TEMP}/adgen-boot.log"
          PID_FILE="${RUNNER_TEMP}/adgen.pid"

          node src/entrypoint.js >"${LOG_FILE}" 2>&1 &
          echo $! >"${PID_FILE}"
          PID="$(cat "${PID_FILE}")"

          cleanup() {
            kill "${PID}" 2>/dev/null || true
            wait "${PID}" 2>/dev/null || true
          }
          trap cleanup EXIT

          ok=0
          delay=1
          elapsed=0
          while [ "${elapsed}" -lt 20 ]; do
            if curl -fsS --max-time 2 "http://localhost:4000/health"; then
              ok=1
              break
            fi
            sleep "${delay}"
            elapsed=$((elapsed + delay))
            if [ "${delay}" -lt 4 ]; then
              delay=$((delay * 2))
            fi
          done

          if [ "${ok}" -ne 1 ]; then
            echo "Health check did not succeed within ~20s"
            cat "${LOG_FILE}"
            exit 1
          fi

      - name: Stop API
        if: always()
        run: |
          PID_FILE="${RUNNER_TEMP}/adgen.pid"
          if [ -f "${PID_FILE}" ]; then
            kill "$(cat "${PID_FILE}")" 2>/dev/null || true
          fi
